[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    real_auth: the request's credential is really checked (see conftest._signed_in_as_researcher)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
